# Claude Assistant — interactive @claude from issue/PR comments + auto-implement from triage
# Adopted from xhr-labs/platform-dev-toolkit AI CI Playbook (Appendix)
#
# Two trigger paths:
# 1. @claude mention: human comments @claude on issue/PR → Claude implements/responds
# 2. claude/implement label: triage bot applies label → Claude auto-implements from issue
#
# Security review:
# - No untrusted input in run: commands (this workflow has NO run: steps except echo)
# - github.event.comment.body / github.event.review.body / github.event.issue.body
#   are ONLY used in job-level `if` expressions (GitHub expression context, not shell)

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Two trigger paths:
    # 1. claude/implement label applied (from triage or human) — bot IS allowed here
    # 2. @claude mention by a non-bot sender
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.event.label.name == 'claude/implement') ||
      (github.event.sender.type != 'Bot' &&
       ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && contains(github.event.issue.body, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Assistant
        id: claude-assistant
        continue-on-error: true
        uses: xhr-labs/platform-dev-toolkit/.github/actions/claude-assistant@main
        with:
          github_token: ${{ secrets.CI_PIPELINE_PAT }}
          claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          system_prompt: |
            You are helping with changes in this repository.
            Read AGENTS.md first — it contains conventions and patterns.

            When triggered from an ISSUE:
            1. Create branch: <type>/<issue-number>-<short-description>
            2. Implement changes following patterns in AGENTS.md
            3. Read .github/PULL_REQUEST_TEMPLATE.md for PR format (if it exists)
            4. Create a PR with `gh pr create` — include `Closes #<issue-number>`

      - name: Report AI status
        if: steps.claude-assistant.outcome == 'failure'
        run: echo "::warning::Claude assistant step failed — check logs above for details"
